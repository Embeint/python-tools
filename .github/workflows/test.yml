---
name: Python Test

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 2
      fail-fast: true
      matrix:
        # Test the extreme Python versions for now to reduce CI runtime; the MCP job covers 3.11
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.15']
        # Exclude Windows 3.15 for now as the lack of pre-built wheels blows out test times
        exclude:
          - os: windows-latest
            python-version: '3.15'
    steps:
      - uses: actions/checkout@v4
        # This is enough to find many quoting issues
        with:
          path: "./check out"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version); print(sys.platform)"
      - name: Use short Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Native dependencies without wheels can exceed Windows' path limit.
          New-Item -ItemType Directory -Force -Path 'D:\t'
          'TEMP=D:\t' >> $env:GITHUB_ENV
          'TMP=D:\t' >> $env:GITHUB_ENV
      - name: install tox
        run: pip3 install tox
      - name: tox
        env:
          INFUSE_PLATFORM_TEST_API_KEY: ${{ secrets.INFUSE_PLATFORM_TEST_API_KEY }}
        run: tox -c 'check out'

  mcp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The oldest supported by the MCP extra, and the version Zephyr uses
        python-version: ['3.11', '3.12']
        environment: [mcp]
        include:
          # The oldest SDK release the extra allows
          - os: ubuntu-latest
            python-version: '3.11'
            environment: mcp-lowest
    steps:
      - uses: actions/checkout@v4
        with:
          path: "./check out"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Use short Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'D:\t'
          'TEMP=D:\t' >> $env:GITHUB_ENV
          'TMP=D:\t' >> $env:GITHUB_ENV
      - run: python -m pip install tox
      - name: MCP protocol and regression tests
        run: tox -c 'check out' -e ${{ matrix.environment }}
