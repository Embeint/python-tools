<!DOCTYPE html>
<html lang="en">
<!-- Don't request favicon.ico -->
<link rel="icon" href="data:,">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDF Viewer</title>
    <!-- Tabulator v6.7.1, bundled locally for offline use -->
    <link href="/tabulator/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="/tabulator/tabulator.min.js"></script>
</head>
<style>
    .tabulator {
        font-family: monospace;
    }

    /* Sidebar sits beside the main content, so opening it shrinks the table */
    .layout {
        display: flex;
        align-items: flex-start;
    }

    .main {
        flex: 1;
        min-width: 0; /* Allow shrinking below the table width */
    }

    .sidebar {
        flex: none;
        width: 0; /* 0 width - change this with JavaScript */
        position: sticky; /* Stay visible while scrolling */
        top: 0;
        max-height: 100vh;
        overflow-x: hidden; /* Disable horizontal scroll */
        overflow-y: auto;
        background-color: #ffffff; /* White */
    }

    #tdf-show {
        vertical-align: top;
    }

    #app-show {
        vertical-align: top;
    }

    #network-show {
        vertical-align: top;
    }

    #data-table {
        width: 100%;
        box-sizing: border-box; /* Include the border in the width */
    }
</style>

<body>
    <div class="layout">
        <div class="main">
            <h1>Infuse-IoT TDF Viewer</h1>

            <div>
                <b>
                Filtering:
                <button class="openbtn" onclick="openFiltering()">&#9776; Options</button>
                </b>

                <b>
                <label for="update_pause">Pause updating: </label>
                <input type="checkbox" id="update_pause" name="update_pause" value="pause">
                </b>
            </div>
            <div id="data-table"></div>
        </div>

        <div id="filteringSidebar" class="sidebar">
            <span id="tdf-show"></span>
            <span id="app-show"></span>
            <span id="network-show"></span>
        </div>
    </div>

    <script>
        // Filtering controls visible or not
        function openFiltering() {
            let elem = document.getElementById("filteringSidebar");
            let open_width = "275px";

            // Toggle sidebar with filtering options
            if (elem.style.width == open_width) {
                elem.style.width = "0px";
            } else {
                elem.style.width = open_width;
            }
        }

        let filtering_update = false;
        // Initialize the Tabulator table
        const dataTable = new Tabulator("#data-table", {
            // Fill the available width and scroll horizontally, so the table shrinks with the sidebar open
            layout: "fitData",
            // Rows are matched by device so they can be updated in place
            index: "infuse_id",
            pagination: "local",
            paginationSize: 25,
            paginationSizeSelector: [10, 25, 50, 100],
            paginationCounter: "rows",
        });
        const shownTdfTable = new Tabulator("#tdf-show", {
            layout: "fitDataTable",
            columns: [
                { title: "TDF", field: "name", width: 200 },
                {
                    title: "Show",
                    field: "checked",
                    hozAlign: "center",
                    formatter: "tickCross",
                    cellClick: function (ev, cell) {
                        filtering_update = true;
                        cell.setValue(!cell.getValue());
                    },
                },
            ]
        });
        const shownAppTable = new Tabulator("#app-show", {
            layout: "fitDataTable",
            columns: [
                { title: "Application", field: "name", width: 200 },
                {
                    title: "Show",
                    field: "checked",
                    hozAlign: "center",
                    formatter: "tickCross",
                    cellClick: function (ev, cell) {
                        filtering_update = true;
                        cell.setValue(!cell.getValue());
                    },
                },
            ]
        });
        const shownNetworkTable = new Tabulator("#network-show", {
            layout: "fitDataTable",
            columns: [
                { title: "Network ID", field: "name", width: 200 },
                {
                    title: "Show",
                    field: "checked",
                    hozAlign: "center",
                    formatter: "tickCross",
                    cellClick: function (ev, cell) {
                        filtering_update = true;
                        cell.setValue(!cell.getValue());
                    },
                },
            ]
        });

        // WebSocket connection and polling state
        let ws = null;
        let shownTDFs = {};
        let currentTDFs = [];
        let current_num_columns = 0;
        let currentApps = [];
        let currentNetworks = []
        let dataRequestId = null;
        let reconnectId = null;

        // Refreshing a row destroys any text selection inside it, so rows in the selection are held
        // while the other rows keep updating. Everything is held while a selection is being dragged.
        const dataTableElem = document.getElementById("data-table");
        let mouseSelecting = false;
        dataTableElem.addEventListener("mousedown", () => { mouseSelecting = true; });
        // Dragging selected text or a scrollbar may not produce a mouseup, so also clear on these
        for (const ev of ["mouseup", "dragend", "pointercancel"]) {
            document.addEventListener(ev, () => { mouseSelecting = false; });
        }
        window.addEventListener("blur", () => { mouseSelecting = false; });

        // Indexes of the rows containing part of the text selection
        function selectedRowIndexes() {
            const selection = window.getSelection();
            if (selection.isCollapsed || !selection.containsNode(dataTableElem, true)) {
                return new Set();
            }
            return new Set(
                dataTable.getRows("visible")
                    .filter(row => selection.containsNode(row.getElement(), true))
                    .map(row => row.getIndex())
            );
        }

        const arraysEqual = (a, b) =>
            a.length === b.length &&
            a.every((element, index) => element === b[index]);

        // Merge new filter options with the existing table data. Unticked options are kept even if the
        // server no longer reports them (e.g. after a restart), so they stay hidden when seen again.
        function mergeFilterOptions(table, names) {
            const currentRows = table.getData();
            const unticked = currentRows.filter(row => !row.checked).map(row => row.name);
            const updatedData = [...new Set([...names, ...unticked])].sort().map(str => {
                const existingRow = currentRows.find(row => row.name === str);
                return existingRow
                    ? existingRow // Preserve the existing row if found
                    : { id: str, name: str, checked: true };
            });
            table.replaceData(updatedData);
        }

        function handleMessage(event) {
            const { columns, rows, tdfs, apps, networks } = JSON.parse(event.data);

            if (!arraysEqual(currentTDFs, tdfs)) {
                // Merge new data with the existing table data
                const currentRows = shownTdfTable.getData();
                const updatedData = tdfs.map(str => {
                    const existingRow = currentRows.find(row => row.name === str);
                    return existingRow
                        ? existingRow // Preserve the existing row if found
                        : { id: str, name: str, checked: true };
                });
                // Update table and refresh the checked state map
                shownTdfTable.replaceData(updatedData);
                shownTDFs = Object.fromEntries(
                    updatedData.map(row => [row.name, row.checked])
                );
                currentTDFs = tdfs;
            }
            const disableData = shownTdfTable.getData();
            shownTDFs = Object.fromEntries(
                disableData.map(row => [row.name, row.checked])
            );

            if (!arraysEqual(currentApps, apps)) {
                mergeFilterOptions(shownAppTable, apps);
                currentApps = apps
                filtering_update = true;
            }

            if (!arraysEqual(currentNetworks, networks)) {
                mergeFilterOptions(shownNetworkTable, networks);
                currentNetworks = networks
                filtering_update = true;
            }

            // Column, filter and new row changes redraw the whole table, so they wait until nothing is selected
            const heldRows = selectedRowIndexes();
            const selecting = mouseSelecting || heldRows.size > 0;

            // Update column definitions if new TDFs have appeared
            if (!selecting && columns.length != current_num_columns) {
                dataTable.setColumns(columns);
                current_num_columns = columns.length;
                filtering_update = true;
            }

            // Dynamically set the table content
            if (current_num_columns > 0 && !document.getElementById('update_pause').checked) {
                if (!selecting) {
                    dataTable.replaceData(rows);
                } else if (!mouseSelecting) {
                    // Update the existing rows outside the selection in place
                    const existingRows = new Set(dataTable.getRows().map(row => row.getIndex()));
                    const updates = rows.filter(row => !heldRows.has(row.infuse_id) && existingRows.has(row.infuse_id));
                    if (updates.length > 0) {
                        dataTable.updateData(updates);
                    }
                }
            }

            if (filtering_update && !selecting) {
                // Hide columns as requested
                dataTable.getColumns().forEach(column => {
                    // Split field name into [TDF_NAME, subfields]
                    const field = column.getField().split('.');
                    if (shownTDFs[field[0]] ?? true) {
                        column.show();
                    } else {
                        column.hide();
                    }
                });

                // Filter applications and networks as requested
                const appShow = Object.fromEntries(
                    shownAppTable.getData().map(row => [row.name, row.checked])
                );
                const networkShow = Object.fromEntries(
                    shownNetworkTable.getData().map(row => [row.name, row.checked])
                );
                const enabledApps = currentApps.filter(a => appShow[a]);
                const enabledNetworks = currentNetworks.filter(a => networkShow[a]);

                function customFilter(data, filterParams) {
                    return filterParams['apps'].includes(data.application) && filterParams["networks"].includes(data.network_id);
                }
                dataTable.clearFilter();
                dataTable.setFilter(customFilter, {apps: enabledApps, networks: enabledNetworks});

                filtering_update = false;
            }
        }

        function dataUpdateRequest() {
            if (!document.hidden && ws?.readyState === WebSocket.OPEN) {
                ws.send("dataUpdateRequest");
            }
        }

        function stopDataRequests() {
            if (dataRequestId !== null) {
                clearInterval(dataRequestId);
                dataRequestId = null;
            }
        }

        function startDataRequests() {
            stopDataRequests();
            if (document.hidden) {
                return;
            }

            // Refresh immediately instead of waiting for the next interval.
            dataUpdateRequest();
            dataRequestId = setInterval(dataUpdateRequest, 1000);
        }

        function connectWebSocket() {
            if (document.hidden || ws?.readyState === WebSocket.CONNECTING || ws?.readyState === WebSocket.OPEN) {
                return;
            }

            const socket = new WebSocket("ws://" + location.host + "/ws");
            ws = socket;

            socket.onmessage = handleMessage;
            socket.onopen = function () {
                if (ws !== socket) {
                    return;
                }
                console.log("WebSocket connected");
                startDataRequests();
            };
            socket.onerror = function (error) {
                console.error("WebSocket error:", error);
            };
            socket.onclose = function () {
                if (ws !== socket) {
                    return;
                }
                ws = null;
                stopDataRequests();
                if (!document.hidden && reconnectId === null) {
                    reconnectId = setTimeout(function () {
                        reconnectId = null;
                        connectWebSocket();
                    }, 1000);
                }
            };
        }

        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                stopDataRequests();
                if (reconnectId !== null) {
                    clearTimeout(reconnectId);
                    reconnectId = null;
                }
                const socket = ws;
                ws = null;
                socket?.close();
            } else {
                connectWebSocket();
            }
        });

        connectWebSocket();
    </script>
</body>

</html>
